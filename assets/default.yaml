rules:
  # --- document / delivery context (informational) ---
  pdf-opened:        {weight: 1, description: "PDF document opened in the instrumented process"}
  pdf-opened-url:    {weight: 1, description: "PDFDocument initWithURL:"}
  paperkit-data:     {weight: 1, description: "PaperKit ingesting document data"}
  quicklook-render:  {weight: 2, description: "QuickLook thumbnail render (delivery channel tag)"}
  aa-cache-render-hit: {weight: 5, description: "aa_cache_render reachable and hooked"}

  pdf-rendered:     {weight: 0, description: "PDF page rendered in the instrumented process"}
  render-complete:  {weight: 0, description: "Renderer completion handshake"}
  image-decoded:    {weight: 0, description: "Image decoded in the instrumented process"}

  # --- medium behavioral signals ---
  image-bomb:        {weight: 10, description: "decoded image >100 MP (decoder stress)"}
  pdf-embedded-font: {weight: 15, description: "font program parsed while PDF data was recently in flight (cross-format boundary)"}

  # --- static stage (elegant-bouncer integration) ---
  bouncer-static-hit:
    weight: 45
    description: "elegant-bouncer structural hit — known exploit shape in the file (static stage)"

  # --- high behavioral signals ---
  glyph-path-anomaly:
    weight: 45
    description: "Non-finite, negative, or oversized exported glyph path (heuristic)"
    escalate:
      add_if_context:
        quicklook_recent: 15   # +15 when the anomaly is delivery-channel adjacent
  big-anon-map:
    weight: 10
    description: "anonymous map >=128MB (heap-spray prep)"
    escalate:
      detail_gte: {field: bytes, gte: 536870912, weight: 45}
  rwx-transition:    {weight: 45, description: "mprotect to RWX (shellcode landing)"}

chains:
  static-runtime-agreement:
    severity: critical
    weight: 60
    window_s: 300
    required_rules: [bouncer-static-hit, glyph-path-anomaly]
    description: "static structural hit + runtime glyph anomaly (known + behavioral agreement)"
  static-image-agreement:
    severity: critical
    weight: 60
    window_s: 300
    required_rules: [bouncer-static-hit, image-bomb]
    description: "static structural hit + decoder stress at runtime (BLASTPASS-class agreement)"
  glyph-grift-chain:
    severity: critical
    weight: 60
    window_s: 120
    required_rules: [glyph-path-anomaly]
    required_tags_any: [quicklook_recent, pdf_open_recent, pdf_render_recent]
    description: "glyph-path anomaly inside recent document context (heuristic)"
  font-crossing:
    severity: critical
    weight: 60
    window_s: 120
    required_rules: [pdf-embedded-font, glyph-path-anomaly]
    required_tags_any: [pdf_open_recent]
    description: "PDF-embedded font crossed into the glyph rasterizer with an anomalous path"

weights:
  critical: 100
  high: 45
  medium: 12
  low: 1

verdict_thresholds:
  exploit-likely: 100
  investigate: 35
